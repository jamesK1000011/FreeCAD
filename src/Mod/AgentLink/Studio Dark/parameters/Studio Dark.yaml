# Studio Dark: FreeCAD's own stylesheet (FreeCAD.qss), its tokens set flat and quiet —
# one surface per role, hairline borders, a single accent. Edit these in
# FreeCAD's theme parameter editor, or here; nothing else is baked in.
PrimaryColor: "#1b1d20"
PanelColor: "#25282c"
WellColor: "#1e2124"
WellDeepColor: "#17191c"
LineColor: "#383c41"
LineStrongColor: "#4b5057"
InkColor: "#e4e6e8"
DimColor: "#a0a4a8"
AccentSoftColor: "#223c55"
StageColor: "#2e3135"
StylesheetIconsColor: "white"
TextUrlColor: "#62aae4"
3DViewBackgroundRefColor: "@StageColor"
AccentBackgroundColor: "@AccentSoftColor"
AccentColor: "@ThemeAccentColor1"
AccentHoverColor: "blend(@GeneralBackgroundHoverColor,@AccentColor,25)"
ActiveTabBackgroundColor: "@PanelColor"
ButtonBackgroundHooverColor: "@GeneralBackgroundHoverColor"
ButtonBorderColor: "@GeneralBorderColor"
ButtonBorderHooverColor: "@AccentColor"
ButtonBottomBackgroundColor: "@PanelColor"
ButtonTopBackgroundColor: "@PanelColor"
CheckBoxBackgroundColor: "@WellColor"
CheckBoxBorderColor: "@GeneralBorderStrongColor"
CheckedButtonBottomBackgroundColor: "@AccentSoftColor"
CheckedButtonTopBackgroundColor: "@AccentSoftColor"
DefaultButtonBorderColor: "@AccentColor"
DefaultButtonBottomBackgroundColor: "@ButtonTopBackgroundColor"
DefaultButtonTopBackgroundColor: "@ButtonTopBackgroundColor"
DialogBackgroundColor: "@PanelColor"
GeneralAlternateBackgroundColor: "@WellColor"
GeneralBackgroundColor: "@PrimaryColor"
GeneralBackgroundHoverColor: "@WellDeepColor"
GeneralBorderColor: "@LineColor"
GeneralBorderHoverColor: "@LineStrongColor"
GeneralBorderStrongColor: "@LineStrongColor"
GeneralDisabledBackgroundColor: "@WellDeepColor"
GeneralGridLinesColor: "@LineColor"
GeneralHeaderBackgroundColor: "@PanelColor"
GroupboxBackgroundColor: "@PanelColor"
GroupboxBorderColor: "@GeneralBorderColor"
IconsLocationFolderName: "images_classic"
InActiveTabBackgroundColor: "@PrimaryColor"
InputFieldBorderRadius: "6px"
MenuBackgroundColor: "@PanelColor"
PrimaryColorDarken1: "darken(@PrimaryColor,5)"
PrimaryColorDarken2: "darken(@PrimaryColor,8)"
PrimaryColorDarken3: "darken(@PrimaryColor,15)"
PrimaryColorDarken4: "darken(@PrimaryColor,20)"
PrimaryColorDarken5: "darken(@PrimaryColor,200)"
PrimaryColorDarken6: "darken(@PrimaryColor,5890)"
PrimaryColorLighten1: "lighten(@PrimaryColor,20)"
PrimaryColorLighten2: "lighten(@PrimaryColor,40)"
PrimaryColorLighten3: "lighten(@PrimaryColor,80)"
PrimaryColorLighten4: "lighten(@PrimaryColor,100)"
PrimaryColorLighten5: "lighten(@PrimaryColor,300)"
PrimaryColorLighten6: "lighten(@PrimaryColor,5890)"
RadioButtonBackgroundColor: "@WellColor"
RadioButtonBorderColor: "@GeneralBorderStrongColor"
ScrollbarBackgroundColor: "@PrimaryColor"
SketcherConflictingConstraintsColor: "#fc6c6c"
SketcherEmptySketchColor: "#ffffff"
SketcherFullyConstrainedColor: "#8cff5b"
SketcherMalformedConstraintsColor: "#fc6c6c"
SketcherPartiallyRedundantConstraintsColor: "#77cbff"
SketcherRedundantConstraintsColor: "#ffa256"
SketcherSolverFailedColor: "#ff9090"
SketcherUnderConstrainedColor: "#ffffff"
TabbarBackgroundColor: "@PrimaryColor"
TextDisabledColor: "@DimColor"
TextEditFieldBackgroundColor: "@WellColor"
TextForegroundColor: "@InkColor"
TextSelectBackgroundColor: "@AccentSoftColor"
ToolButtonCheckedBackground: "@AccentSoftColor"
ToolButtonCheckedBorderColor: "@AccentColor"
ToolbarButtonsPadding: "3px"
